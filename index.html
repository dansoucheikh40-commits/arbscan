<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculateur d'arbitrage sportif  </title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f6f8;
      padding: 20px;
      color: #222;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #111827;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .result {
      margin-top: 25px;
      padding: 18px;
      background: #f0fdf4;
      border-radius: 10px;
      line-height: 1.8;
    }

    .error {
      margin-top: 20px;
      padding: 15px;
      background: #fef2f2;
      color: #b91c1c;
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Calculateur d'arbitrage</h1>

    <label for="cote1">Cote 1</label>
    <input type="number" id="cote1" step="0.01" placeholder="Exemple : 2.50">

    <label for="cote2">Cote 2</label>
    <input type="number" id="cote2" step="0.01" placeholder="Exemple : 2.10">

    <label for="mise">Mise totale (CFA)</label>
    <input type="number" id="mise" step="100" placeholder="Exemple : 10000">

    <button onclick="calculer()">
      Calculer l'arbitrage
    </button>

    <div id="resultat"></div>

  </div>

  <script src="data.js"></script>
  <script src="matches.js"></script>

  <script>

    function calculer() {

      const cote1 = parseFloat(
        document.getElementById("cote1").value
      );

      const cote2 = parseFloat(
        document.getElementById("cote2").value
      );

      const mise = parseFloat(
        document.getElementById("mise").value
      );

      const resultat =
        document.getElementById("resultat");

      if (
        isNaN(cote1) ||
        isNaN(cote2) ||
        isNaN(mise) ||
        cote1 <= 1 ||
        cote2 <= 1 ||
        mise <= 0
      ) {

        resultat.innerHTML = `
          <div class="error">
            Veuillez entrer des valeurs valides.
          </div>
        `;

        return;
      }

      const sommeInverse =
        (1 / cote1) + (1 / cote2);

      const marge =
        (1 - sommeInverse) * 100;

      if (marge <= 0) {

        resultat.innerHTML = `
          <div class="error">

            <strong>Pas d'arbitrage</strong>

            <br><br>

            Marge :
            ${marge.toFixed(2)} %

          </div>
        `;

        return;
      }

      const mise1 =
        mise *
        ((1 / cote1) / sommeInverse);

      const mise2 =
        mise *
        ((1 / cote2) / sommeInverse);

      const retour =
        mise1 * cote1;

      const profit =
        retour - mise;

      resultat.innerHTML = `

        <div class="result">

          <strong>✅ Arbitrage détecté</strong>

          <br><br>

          Marge :
          <strong>
            ${marge.toFixed(2)} %
          </strong>

          <br>

          Mise sur la cote ${cote1} :
          <strong>
            ${Math.round(mise1).toLocaleString()} CFA
          </strong>

          <br>

          Mise sur la cote ${cote2} :
          <strong>
            ${Math.round(mise2).toLocaleString()} CFA
          </strong>

          <br>

          Mise totale :
          <strong>
            ${Math.round(mise1 + mise2).toLocaleString()} CFA
          </strong>

          <br>

          Retour garanti :
          <strong>
            ${Math.round(retour).toLocaleString()} CFA
          </strong>

          <br>

          Profit garanti :
          <strong>
            ${Math.round(profit).toLocaleString()} CFA
          </strong>

        </div>

      `;
    }

  </script>

</body>
</html>
